<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Cài đặt PhishGuard</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Cài đặt PhishGuard</h1>
      <section>
        <h2>Máy chủ Backend</h2>
        <p>Chỉ định URL backend để gửi yêu cầu kiểm tra phishing.</p>
        <label>
          Endpoint kiểm tra URL
          <input type="url" id="backend-url" placeholder="http://localhost:4000/api/check-url" />
        </label>
      </section>
      <section>
        <h2>Ngưỡng cảnh báo</h2>
        <label>
          Điểm cảnh báo (warning)
          <input type="number" min="0" max="1" step="0.05" id="warning-threshold" />
        </label>
        <label>
          Điểm nguy hiểm (danger)
          <input type="number" min="0" max="1" step="0.05" id="danger-threshold" />
        </label>
      </section>
      <button id="save-button">Lưu cấu hình</button>
      <p id="status-message"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
